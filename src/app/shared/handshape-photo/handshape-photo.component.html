<div class="mine">
  <button type="button" (click)="open()">Photographier ma main</button>
  @for (item of catalog.customHandshapes(); track item.id) {
    <span class="custom">
      <img [src]="item.imageUrl" alt="" />
      {{ item.name }}
      <button type="button" class="remove" [attr.aria-label]="'Supprimer ' + item.name" (click)="remove(item)">×</button>
    </span>
  }
</div>

<dialog #dialog aria-labelledby="photo-title" (click)="onDialogClick($event)">
  <form class="body" (submit)="$event.preventDefault(); save()">
    <h2 id="photo-title">Nouvelle configuration</h2>
    <p class="hint">Photographiez votre main sur un fond uni et bien éclairé, la configuration bien visible.</p>

    <div class="picks">
      <!-- capture : ouvre directement l'appareil photo sur mobile (ignoré sur ordinateur). -->
      <label class="pick">
        <span class="button primary">{{ image() ? 'Reprendre la photo' : 'Prendre une photo' }}</span>
        <input #camera type="file" accept="image/*" capture="environment" (change)="onFile(camera)" [disabled]="busy()" />
      </label>
      <label class="pick">
        <span class="button">Choisir dans la galerie</span>
        <input #file type="file" accept="image/*" (change)="onFile(file)" [disabled]="busy()" />
      </label>
    </div>

    @if (previewUrl(); as url) {
      <img class="preview" [src]="url" alt="Aperçu de la configuration" />
    }

    <label class="field">
      <span>Nom de la configuration</span>
      <input
        type="text"
        maxlength="80"
        autocomplete="off"
        placeholder="ex : Pince à trois doigts"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </label>

    @if (error(); as e) {
      <p class="error" role="alert">{{ e }}</p>
    }

    <div class="actions">
      <button type="button" (click)="close()">Annuler</button>
      <button type="submit" class="primary" [disabled]="!image() || !name().trim() || busy()">Enregistrer</button>
    </div>
  </form>
</dialog>
